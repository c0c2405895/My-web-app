<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Wardrobe | ログイン</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='desktop-layout.css') }}">
</head>
<body class="login-page">
  <main class="login-panel">
    <div class="login-brand"><span class="brand-mark">✦</span><span>AI Wardrobe</span></div>
    <p class="eyebrow">WELCOME BACK</p>
    <h1>ログイン</h1>
    <p class="login-description">ワードローブを開くにはログインしてください。</p>
    <form method="post" action="/login" class="login-form">
      <label>メールアドレスまたは電話番号
        <input name="identifier" type="text" autocomplete="username" required placeholder="メールアドレス / 電話番号">
      </label>
      <label>パスワード
        <input name="password" type="password" autocomplete="current-password" required placeholder="パスワード">
      </label>
      {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
      <button id="loginButton" class="primary-btn full login-button" type="submit">ログイン</button>
    </form>
  </main>
  <script>
    document.querySelector(".login-form").addEventListener("submit", () => {
      const button = document.getElementById("loginButton");
      button.disabled = true;
      button.textContent = "ログイン中…";
    });
  </script>
</body>
</html>
