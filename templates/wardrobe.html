<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Wardrobe | ワードローブ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='desktop-layout.css') }}">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">✦</span><span>AI Wardrobe</span></div>
    <nav>
      <a href="/"><span>◷</span> 今日の提案</a>
      <a class="active" href="/wardrobe"><span>▦</span> ワードローブ</a>
      <a href="/settings"><span>⚙</span> 設定</a>
    </nav>
    <div class="sidebar-bottom">
      <a class="mini-profile" href="/settings" aria-label="ユーザー設定"><div class="avatar">{% if profile.avatar %}<img src="{{ profile.avatar }}" alt="アバター">{% else %}A{% endif %}</div><div><b>こんにちは、{{ profile.display_name }}</b><small>あなたのクローゼット</small></div></a>
    </div>
  </aside>
  <main>
    <header class="topbar">
      <div><p class="eyebrow">YOUR COLLECTION</p><h1>ワードローブ</h1><p class="date-line">登録した服を管理できます</p></div>
      <div class="top-actions"><span id="itemCount" class="sync">0 ITEMS</span><a class="avatar small" href="/settings" aria-label="ユーザー設定へ">{% if profile.avatar %}<img src="{{ profile.avatar }}" alt="アバター">{% else %}A{% endif %}</a></div>
    </header>
    <section class="section-head wardrobe-head">
      <button class="primary-btn" onclick="openModal()">＋ 服を登録</button>
    </section>
    <section class="wardrobe-category">
      <div class="section-head"><h2>上着類</h2><span id="outerCount" class="category-count"></span></div>
      <div id="outerGrid" class="wardrobe-grid"></div>
    </section>
    <section class="wardrobe-category">
      <div class="section-head"><h2>ボトム類</h2><span id="bottomCount" class="category-count"></span></div>
      <div id="bottomGrid" class="wardrobe-grid"></div>
    </section>
  </main>
  <div id="modal" class="modal hidden">
    <div class="modal-panel">
      <button class="close" onclick="closeModal()">×</button>
      <p class="eyebrow">ADD TO COLLECTION</p><h2>服を登録する</h2>
      <form id="itemForm">
        <label class="dropzone" for="photo"><span>＋</span><b>写真をアップロード</b><small>PNG, JPG, WEBP / 最大8MB</small><input id="photo" name="photo" type="file" accept="image/*" required></label>
        <label>服の名前<input name="name" placeholder="例：ジーンズ（デニム）" maxlength="80"></label>
        <button class="primary-btn full" type="submit">登録完了</button>
        <p id="formError" class="form-error"></p>
      </form>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script src="{{ url_for('static', filename='wardrobe.js') }}"></script>
</body>
</html>
